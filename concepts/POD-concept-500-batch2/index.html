const categories = ['All', ...Array.from(new Set(ITEMS.map(i => i.category)))];
let activeCategory = 'All';
let searchTerm = '';

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  categories.forEach(cat => {
    const count = cat === 'All' ? ITEMS.length : ITEMS.filter(i => i.category === cat).length;
    const tab = document.createElement('div');
    tab.className = 'tab' + (cat === activeCategory ? ' active' : '');
    tab.innerHTML = `${cat} <span class="count">${count}</span>`;
    tab.addEventListener('click', () => { activeCategory = cat; renderTabs(); renderGrid(); });
    tabsEl.appendChild(tab);
  });
}

function getFiltered() {
  return ITEMS.filter(i => {
    const matchesCat = activeCategory === 'All' || i.category === activeCategory;
    const matchesSearch = !searchTerm ||
      i.name.toLowerCase().includes(searchTerm) ||
      i.body.toLowerCase().includes(searchTerm);
    return matchesCat && matchesSearch;
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const filtered = getFiltered();
  document.getElementById('resultCount').textContent = `${filtered.length} concept${filtered.length === 1 ? '' : 's'}`;
  grid.innerHTML = '';
  if (filtered.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const frag = document.createDocumentFragment();
  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="item-head">
        <div>
          <div class="item-num">${item.number}</div>
          <div class="item-name">${item.name}</div>
        </div>
        <div class="item-cat">${item.category}</div>
      </div>
      <div class="item-body">${item.body}</div>
      <div class="item-foot"><button class="copy-btn">Copy</button></div>
    `;
    card.querySelector('.copy-btn').addEventListener('click', (e) => {
      const fullText = `${item.name}\n\n${item.body}`;
      navigator.clipboard.writeText(fullText).then(() => {
        const btn = e.target;
        const orig = btn.textContent;
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1200);
      }).catch(() => {});
    });
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderGrid();
});

document.getElementById('copyVisibleBtn').addEventListener('click', (e) => {
  const filtered = getFiltered();
  const text = filtered.map(i => `## ${i.number}. ${i.name}\n\n${i.body}`).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = e.target;
    btn.textContent = `Copied ${filtered.length} concepts`;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy all visible'; btn.classList.remove('copied'); }, 1600);
  }).catch(() => {});
});

renderTabs();
renderGrid();
</script>
