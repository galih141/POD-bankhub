<html lang="en">
<head>

<title>700 Halftone Collage Elements</title>

<style>
  :root {

  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    position: sticky; top: 0; top: env(safe-area-inset-top, 0px);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 10;
  }
  .topbar-inner { max-width: 1180px; margin: 0 auto; padding: 20px 24px 16px; }

  .title-row {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
  }
  h1 {
    font-weight: 700; font-size: 19px; letter-spacing: -0.01em; margin: 0;
  }
  .title-meta { color: var(--text-soft); font-size: 13px; margin-top: 3px; }

  #search {
    width: 100%; background: var(--chip-bg); border: none;
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 13.5px; margin-bottom: 14px;
  }
  #search::placeholder { color: var(--text-soft); }
  #search:focus { outline: none; box-shadow: 0 0 0 2px var(--accent); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    background: var(--chip-bg); border: none; border-radius: 999px;
    padding: 6px 13px; font-size: 12.5px; cursor: pointer; color: var(--text-soft);
    font-family: 'Inter', sans-serif; font-weight: 500; white-space: nowrap;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .tab .count { opacity: .65; margin-left: 3px; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: var(--bg); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 24px 100px; }
  .result-count { color: var(--text-soft); font-size: 12.5px; margin: 0 0 16px; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 12px;
  }
  .item-card {
    background: var(--surface); border: none; border-radius: 10px;
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .item-num { color: var(--text-soft); font-size: 11px; font-variant-numeric: tabular-nums; }
  .item-name { font-weight: 600; font-size: 14.5px; margin: 3px 0 0; line-height: 1.3; }
  .item-cat {
    font-size: 10.5px; font-weight: 500; color: var(--text-soft); background: var(--chip-bg);
    border-radius: 999px; padding: 3px 9px; white-space: nowrap; height: fit-content;
  }
  .item-body { font-size: 12.5px; line-height: 1.65; color: var(--text-soft); flex: 1; }
  .item-foot { display: flex; justify-content: flex-end; margin-top: 2px; }
  .copy-btn {
    background: var(--chip-bg); color: var(--text-soft); border: none;
    border-radius: 6px; padding: 6px 12px; font-family: 'Inter', sans-serif;
    font-size: 11.5px; font-weight: 500; cursor: pointer; transition: all .12s ease;
  }
  .copy-btn:hover { background: var(--accent); color: var(--bg); }
  .copy-btn.copied { background: var(--accent); color: var(--bg); }

  .empty-state { text-align: center; color: var(--text-soft); padding: 70px 0; font-size: 13.5px; }

  .fab {
    position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); right: 22px;
    background: var(--accent); color: var(--bg); border: none; border-radius: 999px;
    padding: 12px 20px; font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
    cursor: pointer; box-shadow: 0 6px 20px var(--shadow);
    transition: transform .12s ease;
  }
  .fab:hover { transform: translateY(-1px); }
  .fab.copied { background: #16a34a; color: #fff; }
</style>
</head>

const types = ['All', ...Array.from(new Set(ITEMS.map(i => i.type)))];
let activeType = 'All';
let searchTerm = '';

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  types.forEach(t => {
    const count = t === 'All' ? ITEMS.length : ITEMS.filter(i => i.type === t).length;
    const tab = document.createElement('div');
    tab.className = 'tab' + (t === activeType ? ' active' : '');
    tab.innerHTML = `${t} <span class="count">${count}</span>`;
    tab.addEventListener('click', () => { activeType = t; renderTabs(); renderGrid(); });
    tabsEl.appendChild(tab);
  });
}

function getFiltered() {
  return ITEMS.filter(i => {
    const matchesType = activeType === 'All' || i.type === activeType;
    const matchesSearch = !searchTerm ||
      i.name.toLowerCase().includes(searchTerm) ||
      i.body.toLowerCase().includes(searchTerm) ||
      i.category.toLowerCase().includes(searchTerm);
    return matchesType && matchesSearch;
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const filtered = getFiltered();
  document.getElementById('resultCount').textContent = `${filtered.length} concept${filtered.length === 1 ? '' : 's'}`;
  grid.innerHTML = '';
  if (filtered.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const frag = document.createDocumentFragment();
  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="item-head">
        <div>
          <div class="item-num">${item.number}</div>
          <div class="item-name">${item.name}</div>
        </div>
        <div class="item-cat">${item.category}</div>
      </div>
      <div class="item-body">${item.body}</div>
      <div class="item-foot"><button class="copy-btn">Copy</button></div>
    `;
    card.querySelector('.copy-btn').addEventListener('click', (e) => {
      const fullText = `${item.name}\n\n${item.body}`;
      navigator.clipboard.writeText(fullText).then(() => {
        const btn = e.target;
        const orig = btn.textContent;
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1200);
      }).catch(() => {});
    });
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderGrid();
});

document.getElementById('copyVisibleBtn').addEventListener('click', (e) => {
  const filtered = getFiltered();
  const text = filtered.map(i => `## ${i.number}. ${i.name}\n\n${i.body}`).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = e.target;
    btn.textContent = `Copied ${filtered.length} concepts`;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy all visible'; btn.classList.remove('copied'); }, 1600);
  }).catch(() => {});
});

renderTabs();
renderGrid();
</script>
